  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      margin: 0; padding: 0;
      background: #F4F7FB;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Hind Siliguri', 'Tiro Bangla', 'Poppins', sans-serif;
    }

    #ssa-root {
      --bg:          #F4F7FB;
      --bg2:         #EAF1F9;
      --bg3:         #F5F8FC;
      --card:        #FFFFFF;
      --line:        rgba(13,148,136,0.14);
      --glass-border:rgba(15,23,42,0.08);

      --ink:         #0F172A;
      --ink-soft:    #475569;
      --ink-muted:   #94A3B8;

      --primary:        #0D9488;    /* Premium Teal */
      --primary-glow:   rgba(13,148,136,0.25);
      --primary-deep:   #115E59;
      --primary-bright: #14B8A6;

      --sidebar-top:  #115E59;
      --sidebar-bot:  #042F2E;

      --accent:      #059669;
      --gold:        #D97706;
      --gold-soft:   rgba(217,119,6,0.12);
      --gold-ink:    #B45309;

      --danger:      #E11D48;
      --danger-soft: rgba(225,29,72,0.12);
      --success:     #10B981;

      --glass-shadow: 0 20px 45px -18px rgba(15,23,42,0.15);

      font-family: 'Hind Siliguri', 'Tiro Bangla', 'Poppins', sans-serif;
      font-size: 16.5px;
      line-height: 1.6;
      color: var(--ink);
      background: var(--bg);
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .ssa-en { font-family: 'Poppins', sans-serif; }
    #ssa-root h1,#ssa-root h2,#ssa-root h3 { font-family: 'Hind Siliguri','Tiro Bangla','Poppins',sans-serif; }
    #ssa-root button, #ssa-root input, #ssa-root select, #ssa-root textarea { font-family: inherit; }
    #ssa-root button { cursor: pointer; }

    /* Background glow */
    body::before {
      content:'';
      position:fixed; inset:0; pointer-events:none; z-index:0;
      background:
        radial-gradient(ellipse 60% 50% at 15% 0%, rgba(13,148,136,.10), transparent),
        radial-gradient(ellipse 50% 40% at 85% 100%, rgba(5,150,105,.08), transparent);
    }

    /* ── LOGIN ── */
    .ssa-login-wrap {
      flex: 1; display: flex; align-items: center; justify-content: center;
      padding: 20px; position: relative; z-index: 1;
    }
    .ssa-login-card {
      width: 100%; max-width: 410px; background: var(--card);
      border: 1px solid var(--glass-border); border-radius: 24px;
      padding: 42px 36px 36px; text-align: center;
      box-shadow: var(--glass-shadow), 0 0 0 1px rgba(13,148,136,.1);
    }
    .ssa-seal { width: 76px; height: 76px; margin: 0 auto 16px; }
    .ssa-login-card h1 {
      font-size: 25px; margin: 0 0 4px;
      background: linear-gradient(135deg, #0D9488 0%, #115E59 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .ssa-login-sub { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 24px; font-weight: 500; }
    .ssa-field { text-align: left; margin-bottom: 15px; }
    .ssa-field label { display: block; font-size: 13.5px; color: var(--ink-soft); margin-bottom: 6px; font-weight: 600; }
    .ssa-field input, .ssa-field textarea, .ssa-field select {
      width: 100%; padding: 10px 14px; border: 1px solid #CBD5E1;
      border-radius: 10px; font-size: 15.5px; background: #F8FAFC; color: var(--ink);
      transition: border .2s, background .2s;
    }
    .ssa-field input:focus, .ssa-field textarea:focus, .ssa-field select:focus {
      outline: none; border-color: var(--primary); background: #FFFFFF;
      box-shadow: 0 0 0 3px rgba(13,148,136,0.15);
    }
    .ssa-login-btn {
      width: 100%; padding: 12px; border: none; border-radius: 12px; margin-top: 8px;
      background: linear-gradient(135deg, #0D9488 0%, #115E59 100%);
      color: #fff; font-weight: 700; font-size: 17px;
      box-shadow: 0 8px 20px -4px rgba(13,148,136,.4);
      transition: transform .15s, box-shadow .15s;
    }
    .ssa-login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 24px -6px rgba(13,148,136,.55); }
    .ssa-login-error { color: var(--danger); font-size: 14px; margin-top: 12px; min-height: 16px; font-weight: 600; }

    /* ── SHELL & SIDEBAR ── */
    .ssa-app { display: none; flex: 1; flex-direction: column; height: 100vh; overflow: hidden; position: relative; z-index: 1; }
    .ssa-shell { display: flex; flex: 1; height: 100vh; overflow: hidden; }

    .ssa-sidebar {

    }
    .ssa-brand {

    .ssa-brand svg { width: 34px; height: 34px; flex-shrink: 0; }
    .ssa-brand-text { font-size: 17px; line-height: 1.3; font-weight: 700; color: #FFFFFF; }
    .ssa-brand-sub { font-size: 11.5px; color: rgba(255,255,255,.68); font-weight: 500; }

    .ssa-nav { display: flex; flex-direction: column; gap: 4px; }
    .ssa-nav button {
      display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;

    .ssa-page-sub { color: var(--ink-soft); font-size: 14.5px; margin: 0 0 22px; font-weight: 500; }

    /* ── STATS ── */
    .ssa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .ssa-stat {
      background: var(--card); border: 1px solid var(--glass-border); border-radius: 16px;
      padding: 18px 20px; box-shadow: 0 4px 18px -8px rgba(15,23,42,0.08);
      transition: transform .2s, box-shadow .2s;
    }
    .ssa-stat:hover { transform: translateY(-2px); box-shadow: 0 10px 24px -8px rgba(15,23,42,0.14); }
    .ssa-stat-icon {
      width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
      background: var(--primary-glow); color: var(--primary); margin-bottom: 12px;
    }
    .ssa-stat.warn .ssa-stat-icon { background: var(--danger-soft); color: var(--danger); }
    .ssa-stat-label { font-size: 13px; color: var(--ink-soft); margin-bottom: 4px; font-weight: 600; }
    .ssa-stat-value { font-size: 23px; font-weight: 800; color: var(--ink); }
    .ssa-stat.warn .ssa-stat-value { color: var(--danger); }

    /* ── BUTTONS ── */
    .ssa-btn {
      border: none; border-radius: 10px; padding: 9px 16px;
      font-size: 15px; font-weight: 600; cursor: pointer; transition: all .2s;
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
    }
    .ssa-btn svg { width: 16px; height: 16px; flex-shrink: 0; }
    .ssa-btn-primary {
      background: linear-gradient(135deg, #0D9488, #115E59); color: #fff;
      box-shadow: 0 4px 12px -3px rgba(13,148,136,.5);
    }
    .ssa-btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 16px -3px rgba(13,148,136,.65); }
    .ssa-btn-ghost { background: #FFFFFF; border: 1px solid #CBD5E1; color: var(--ink-soft); }
    .ssa-btn-ghost:hover { background: #F1F5F9; color: var(--ink); border-color: #94A3B8; }
    .ssa-btn-gold { background: var(--gold-soft); color: var(--gold-ink); border: 1px solid rgba(217,119,6,.25); }
    .ssa-btn-gold:hover { background: rgba(217,119,6,.22); }
    .ssa-btn-danger { background: var(--danger-soft); color: var(--danger); border: 1px solid rgba(225,29,72,.2); }
    .ssa-btn-danger:hover { background: rgba(225,29,72,.22); }
    .ssa-btn-sm { padding: 5px 11px; font-size: 13.5px; border-radius: 8px; }

    /* ── TABLE ── */
    .ssa-table-wrap {
      background: var(--card); border: 1px solid var(--glass-border); border-radius: 16px;
      overflow-x: auto; -webkit-overflow-scrolling: touch; box-shadow: 0 4px 18px -8px rgba(15,23,42,0.06);
    }
    table.ssa-table { width: 100%; min-width: 800px; border-collapse: collapse; font-size: 15px; }
    table.ssa-table th {
      text-align: left; background: #F8FAFC; color: #334155; font-weight: 700;
      padding: 12px 14px; font-size: 13.5px; border-bottom: 1px solid #E2E8F0;
    }
    table.ssa-table td { padding: 11px 14px; border-top: 1px solid #F1F5F9; vertical-align: middle; }
    table.ssa-table tr:hover td { background: #F8FAFC; }

    .ssa-avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; border: 1.5px solid #CBD5E1; }
    .ssa-pill { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 13px; font-weight: 700; }
    .ssa-pill.gold { background: #ECFDF5; color: #047857; border: 1px solid #A7F3D0; }
    .ssa-pill.brick { background: #FFF1F2; color: #BE123C; border: 1px solid #FECDD3; }

    .v-id-logo-icon {

    .v-id-org-sub { font-size: 10px; font-weight: 600; text-transform: uppercase; color: #64748B; letter-spacing: .08em; margin-top: 1px; }

    /* Curved Wings Middle Section (Exact Match to Screenshot!) */
    .v-id-mid {
      position: relative; height: 136px; margin: 6px 0;
      display: flex; align-items: center; justify-content: center;
    }
    .v-id-wing-left {
      position: absolute; left: 0; top: 0; height: 100%; width: 45%;
    }
    .v-id-wing-right {
      position: absolute; right: 0; top: 0; height: 100%; width: 45%;

    .v-id-photo-frame {
      position: relative; z-index: 3; width: 114px; height: 114px; border-radius: 50%;

    .v-id-name-sec { position: relative; z-index: 2; text-align: center; padding: 0 16px; }
    .v-id-name { font-size: 19px; font-weight: 800; color: #0F172A; line-height: 1.2; }
    .v-id-role { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #0D9488; letter-spacing: .05em; margin-top: 1px; }

    .v-id-details {
      position: relative; z-index: 2; margin: 10px 22px 0; background: #F8FAFC;
      border: 1px solid #F1F5F9; border-radius: 12px; padding: 9px 14px;
    }
    .v-id-table { width: 100%; font-size: 12px; border-collapse: separate; border-spacing: 0 3px; }
    .v-id-table td.k { width: 42%; font-weight: 600; color: #64748B; font-size: 10.5px; text-transform: uppercase; }
    .v-id-table td.sep { width: 6%; color: #94A3B8; font-weight: bold; }
    .v-id-table td.v { font-weight: 700; color: #0F172A; }

    .v-id-footer {
      position: absolute; bottom: 0; left: 0; right: 0; height: 36px;
      background: linear-gradient(135deg, #0D9488, #115E59);

    /* ── MODALS ── */
    .ssa-overlay {
      display: none; position: fixed; inset: 0; background: rgba(15,23,42,.75);
      z-index: 9999; align-items: center; justify-content: center; padding: 16px;

    }

      background: #FFFFFF; border-radius: 20px; width: 100%; max-width: 480px;

    #ssa-print-zone { position: fixed; left: -9999px; top: 0; }

    @media (max-width: 768px) {
      .ssa-shell { flex-direction: column; }
      .ssa-sidebar {
        width: 100%; flex-direction: row; justify-content: space-between; align-items: center;
        padding: 10px 16px;
      }
      .ssa-brand { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
      .ssa-user-info { display: none; }
      .ssa-nav {
        position: fixed; bottom: 0; left: 0; right: 0; background: #FFFFFF;
        flex-direction: row; justify-content: space-around; padding: 8px 6px calc(8px + env(safe-area-inset-bottom));

      }
      .ssa-nav button {
        flex-direction: column; gap: 2px; padding: 5px 3px; font-size: 11px;

      .ssa-main { padding: 16px 14px 100px 14px; }
      .ssa-stats { grid-template-columns: repeat(2, 1fr); gap: 8px; }
      #ssa-profile-card-holder { transform: scale(0.72); transform-origin: top center; margin-bottom: -110px; }

<script>
(function() {
  // Settings with fallback to Firestore/Local
  var settings = {
    orgName: 'সপ্তদশ সহযাত্রা',
    orgSub: 'সঞ্চয় ও ঋণদান সমবায় সমিতি',
    phone: '01712-345678',
    email: 'info@shoptodash.org',
    address: 'বাগমারা, রাজশাহী, বাংলাদেশ',
    cardTheme: 'teal',
    defaultInstallment: 1000,
    defaultDueDay: 12,
    defaultFine: 300,
    registrationNo: 'রেজিঃ ১৭/২০২৬'
  };

  var db = firebase.firestore();
  var auth = firebase.auth();
  var authReady = new Promise(function(resolve) {
    auth.onAuthStateChanged(function(u) {
      if (u) { resolve(u); }
      else { auth.signInAnonymously().then(function(c){ resolve(c.user); }).catch(function(){ resolve(null); }); }
    });
  });

  var state = {
    members: [], dueMembers: [], users: [], dashboard: null,
    page: 'dashboard', auth: null,
    pagination: { members: 1, due: 1, dashDue: 1 }
  };

  var FALLBACK_AVATAR = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22%230d9488%22%3E%3Cpath%20d%3D%22M12%2012c2.21%200%204-1.79%204-4s-1.79-4-4-4-4%201.79-4%204%201.79%204%204%204zm0%202c-2.67%200-8%201.34-8%204v2h16v-2c0-2.66-5.33-4-8-4z%22%2F%3E%3C%2Fsvg%3E';

  function esc(s){ return (s===undefined||s===null)?'':String(s); }
  function money(n){ return Number(n||0).toLocaleString('bn-BD'); }
  function bnDate(d){
    if(!d) return '—';
    var dt = new Date(d);
    return isNaN(dt)?esc(d):dt.toLocaleDateString('bn-BD', {year:'numeric', month:'long', day:'numeric'});
  }
  function formatMobile(m){
    var digits = String(m||'').replace(/\D/g,'');
    if(!digits) return '';
    if(digits.indexOf('880')===0) digits = digits.substring(3);
    if(digits.indexOf('0')!==0) digits = '0'+digits;
    return digits;
  }

  // Load custom settings from Firestore
  authReady.then(function() {
    db.collection('settings').doc('org_settings').get().then(function(doc) {
      if (doc.exists) {
        var d = doc.data();
        Object.assign(settings, d);
      }
    }).catch(function(){});
  });

  // Ledger generator
  function generateLedger(m, payments) {
    var startYear = 2026, startMonth = 1;
    var now = new Date();
    var currYear = now.getFullYear(), currMonth = now.getMonth() + 1, today = now.getDate();
    var dueDay = Number(m.DueDay || settings.defaultDueDay || 12);
    var installment = Number(m.InstallmentAmount || settings.defaultInstallment || 1000);
    var fineRate = Number(m.FineAmount || settings.defaultFine || 300);
    var monthsList = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];

    var payMap = {};
    (payments || []).forEach(function(p) {
      var d = new Date(p.Date);
      var ym = (p.Month && p.Month.length >= 7) ? p.Month.substring(0,7) : (d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2));
      if (!payMap[ym]) payMap[ym] = { paid: 0, finePaid: 0, dates: [], notes: [], raw: [] };
      payMap[ym].paid += Number(p.Amount || 0);
      payMap[ym].finePaid += Number(p.Fine || 0);
      if (p.Date) payMap[ym].dates.push(p.Date);
      if (p.Note) payMap[ym].notes.push(p.Note);
      payMap[ym].raw.push(p);
    });

    var allYm = new Set(Object.keys(payMap));
    var y = startYear, mo = startMonth, guard = 1200;
    while(guard-- > 0) {
      allYm.add(y + '-' + ('0'+mo).slice(-2));
      if (y === currYear && mo === currMonth) break;
      mo++; if (mo > 12) { mo = 1; y++; }
    }

    var sortedYm = Array.from(allYm).sort();
    var ledger = [];
    sortedYm.forEach(function(ym) {
      var parts = ym.split('-');
      var pY = parseInt(parts[0]), pM = parseInt(parts[1]);
      var mName = monthsList[pM-1] + ' ' + pY;
      var expected = (ym === '2026-01') ? 500 : installment;
      var isPastDue = (pY < currYear) || (pY === currYear && pM < currMonth) || (pY === currYear && pM === currMonth && today > dueDay);
      var pData = payMap[ym] || { paid: 0, finePaid: 0, dates: [], notes: [], raw: [] };
      var dueAmt = Math.max(0, expected - pData.paid);
      var dueFine = (dueAmt > 0 && isPastDue) ? Math.max(0, fineRate - pData.finePaid) : 0;
      ledger.push({
        ym: ym, monthName: mName, expected: expected,
        paid: pData.paid, finePaid: pData.finePaid,
        dueAmt: dueAmt, dueFine: dueFine, isPastDue: isPastDue,
        dates: pData.dates, notes: pData.notes, raw: pData.raw
      });
    });
    return ledger;
  }

  function calculateAllData() {
    var globalPaid = 0, globalFine = 0;
    state.dueMembers = [];
    state.members.forEach(function(m) {
      var ledger = generateLedger(m, m.payments || []);
      var mPaid = 0, mFine = 0, missing = [], dueAmt = 0, dueFine = 0;
      ledger.forEach(function(entry) {
        mPaid += entry.paid; mFine += entry.finePaid;
        if (entry.dueAmt > 0 || entry.dueFine > 0) {
          missing.push(entry);
          dueAmt += entry.dueAmt; dueFine += entry.dueFine;
        }
      });
      m.totalPaid = mPaid; m.totalFine = mFine;
      m.dueAmount = dueAmt; m.dueFineAmount = dueFine;
      m.missingMonths = missing;
      globalPaid += mPaid; globalFine += mFine;
      if (dueAmt > 0 || dueFine > 0) state.dueMembers.push(m);
    });
    state.dashboard = {
      totalMembers: state.members.length,
      totalCollected: globalPaid,
      totalFineCollected: globalFine,
      duesAmount: state.dueMembers.reduce(function(s,m){ return s + m.dueAmount; }, 0),
      duesFine: state.dueMembers.reduce(function(s,m){ return s + m.dueFineAmount; }, 0),
      duesCount: state.dueMembers.length
    };
  }

  function loadData() {
    document.getElementById('ssa-main').innerHTML = '<div style="text-align:center;padding:50px;">তথ্য লোড হচ্ছে...</div>';
    authReady.then(function() {
      return db.collection('members').get();
    }).then(function(snap) {
      var arr = [];
      snap.forEach(function(d) {
        var data = d.data();
        arr.push({
          ID: d.id, Name: data.name, MemberNo: data.member_no, Mobile: data.mobile,
          InstallmentAmount: data.installment_amount || 1000,
          DueDay: data.due_day || 12, FineAmount: data.fine_amount || 300,
          Photo: data.photo || '', BloodGroup: data.blood_group || ''
        });
      });
      arr.sort(function(a, b) {
        return (parseInt(String(a.MemberNo).replace(/\D/g,''))||0) - (parseInt(String(b.MemberNo).replace(/\D/g,''))||0);
      });
      state.members = arr;
      return db.collection('payments').get();
    }).then(function(psnap) {
      var pMap = {};
      psnap.forEach(function(d) {
        var p = d.data();
        var mId = String(p.member_id);
        if (!pMap[mId]) pMap[mId] = [];
        pMap[mId].push({ ID: d.id, MemberID: mId, Month: p.month, Amount: p.amount, Date: p.date, Fine: p.fine, Note: p.note });
      });
      state.members.forEach(function(m) { m.payments = pMap[m.ID] || []; });
      calculateAllData();
      renderCurrentPage();
    });
  }

          );
        }).join('') +
        '</tbody></table>' +
      '</div>'
    );
  }

  function renderDue() {
    document.getElementById('ssa-main').innerHTML = (
      '<h2 class="ssa-page-title">বকেয়া সদস্য তালিকা</h2>' +
      '<p class="ssa-page-sub">' + state.dueMembers.length + ' জন সদস্যের বকেয়া রয়েছে</p>' +
      '<div class="ssa-table-wrap">' +
        '<table class="ssa-table"><thead><tr><th>সদস্য নং</th><th>নাম</th><th>মোবাইল</th><th>বকেয়া কিস্তি</th><th>বকেয়া জরিমানা</th><th>মোট বকেয়া</th></tr></thead><tbody>' +
        state.dueMembers.map(function(m) {
          return '<tr><td class="ssa-en" style="font-weight:bold;">' + esc(m.MemberNo) + '</td><td>' + esc(m.Name) + '</td><td class="ssa-en">' + (formatMobile(m.Mobile)||'—') + '</td><td>৳' + money(m.dueAmount) + '</td><td>৳' + money(m.dueFineAmount) + '</td><td style="color:#E11D48;font-weight:bold;">৳' + money(m.dueAmount+m.dueFineAmount) + '</td></tr>';
        }).join('') +
        '</tbody></table>' +
      '</div>'
    );
  }

  function renderSettings() {
    document.getElementById('ssa-main').innerHTML = (
      '<h2 class="ssa-page-title">সিস্টেম কাস্টমাইজেশন</h2>' +
      '<p class="ssa-page-sub">সংস্থার নাম, স্লোগান ও কিস্তির ডিফল্ট মান পরিবর্তন করুন</p>' +
      '<div style="max-width:600px;background:#fff;border-radius:16px;padding:26px;border:1px solid #E2E8F0;">' +
        '<form id="settings-form">' +
          '<div class="ssa-field"><label>সংস্থার নাম</label><input type="text" id="set-name" value="' + esc(settings.orgName) + '" required></div>' +
          '<div class="ssa-field"><label>স্লোগান / সাবটাইটেল</label><input type="text" id="set-sub" value="' + esc(settings.orgSub) + '"></div>' +
          '<div class="ssa-field"><label>ডিফল্ট মাসিক কিস্তি (৳)</label><input type="number" id="set-inst" value="' + settings.defaultInstallment + '" required></div>' +
          '<div class="ssa-field"><label>কিস্তি পরিশোধের শেষ দিন</label><input type="number" id="set-due" value="' + settings.defaultDueDay + '" required></div>' +
          '<div class="ssa-field"><label>ডিফল্ট বিলম্ব জরিমানা (৳)</label><input type="number" id="set-fine" value="' + settings.defaultFine + '" required></div>' +
          '<button type="submit" class="ssa-btn ssa-btn-primary" style="width:100%;padding:12px;margin-top:10px;">সংরক্ষণ করুন</button>' +
        '</form>' +
      '</div>'
    );
    document.getElementById('settings-form').onsubmit = function(e) {
      e.preventDefault();
      settings.orgName = document.getElementById('set-name').value;
      settings.orgSub = document.getElementById('set-sub').value;
      settings.defaultInstallment = Number(document.getElementById('set-inst').value);
      settings.defaultDueDay = Number(document.getElementById('set-due').value);
      settings.defaultFine = Number(document.getElementById('set-fine').value);
      db.collection('settings').doc('org_settings').set(settings, { merge: true }).then(function() {
        alert('সেটিংস সফলভাবে সংরক্ষিত হয়েছে!');
        renderApp();
      });
    };
  }

  // Init
  var saved = sessionStorage.getItem('ssa_auth');
  if (saved) {
    try { state.auth = JSON.parse(saved); renderApp(); } catch(e) { renderLogin(); }
  } else {
    renderLogin();
  }
})();
</script>
</body>
</html>
