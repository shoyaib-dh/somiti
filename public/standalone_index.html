<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Shoptodash - Savings & Member Management Portal</title>
  
  <script>
    (function() {
      try {
        var _fetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: function() { return _fetch; },
          set: function(fn) { _fetch = fn; }
        });
      } catch (e) {}
      window.addEventListener('error', function(e) {
        if (e && e.message && e.message.indexOf('fetch') !== -1 && e.message.indexOf('getter') !== -1) {
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          if (e.preventDefault) e.preventDefault();
          return true;
        }
      }, true);
    })();
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas-pro@1.5.8/dist/html2canvas-pro.min.js"></script>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
  <script>
    var firebaseConfig = {
      apiKey: "AIzaSyDj_neKSouBkrdq6bHSni0E0LrTX1YkWwE",
      authDomain: "shoptodash.firebaseapp.com",
      projectId: "shoptodash",
      storageBucket: "shoptodash.firebasestorage.app",
      messagingSenderId: "857362333061",
      appId: "1:857362333061:web:ff2f23b0ee313d194dd8ec"
    };
    firebase.initializeApp(firebaseConfig);
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; font-family: 'Poppins', sans-serif; }

    body {
      margin: 0; padding: 0;
      background: #F8FAFC;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Poppins', sans-serif;
      color: #0F172A;
    }

    #ssa-root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --primary: #0D9488;
      --primary-dark: #115E59;
      --danger: #E11D48;
      width: 100%; height: 100vh;
      display: flex; flex-direction: column;
    }

    .ssa-login-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .ssa-login-card {
      width: 100%; max-width: 400px; background: #fff;
      border: 1px solid #E2E8F0; border-radius: 24px; padding: 40px 32px;
      text-align: center; box-shadow: 0 20px 45px -15px rgba(15,23,42,0.15);
    }
    .ssa-field { text-align: left; margin-bottom: 15px; }
    .ssa-field label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 6px; text-transform: uppercase; }
    .ssa-field input, .ssa-field select {
      width: 100%; padding: 10px 14px; border: 1px solid #CBD5E1; border-radius: 10px; font-size: 14px;
    }
    .ssa-login-btn {
      width: 100%; padding: 12px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #0D9488, #115E59); color: #fff;
      font-weight: 700; font-size: 15px; cursor: pointer; text-transform: uppercase;
    }

    .ssa-shell { display: flex; flex: 1; height: 100vh; overflow: hidden; }
    .ssa-sidebar {
      width: 250px; background: linear-gradient(190deg, #115E59 0%, #042F2E 100%);
      padding: 20px 14px; display: flex; flex-direction: column; color: #fff; flex-shrink: 0;
    }
    .ssa-nav button {
      display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
      padding: 10px 12px; border: none; background: transparent; color: #CCFBF1;
      border-radius: 10px; font-size: 13px; font-weight: 600; cursor: pointer; text-transform: uppercase;
    }
    .ssa-nav button.active { background: rgba(255,255,255,0.18); color: #fff; font-weight: 700; }
    .ssa-main { flex: 1; padding: 24px 32px; overflow-y: auto; }

    .ssa-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .ssa-stat { background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; padding: 18px 20px; box-shadow: 0 4px 15px -5px rgba(0,0,0,0.05); }
    .ssa-stat-label { font-size: 11px; font-weight: 700; color: #64748B; text-transform: uppercase; }
    .ssa-stat-value { font-size: 22px; font-weight: 800; color: #0F172A; margin-top: 4px; }

    .ssa-btn {
      border: none; border-radius: 10px; padding: 8px 16px; font-size: 13px; font-weight: 700; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .ssa-btn-primary { background: #0D9488; color: #fff; }
    .ssa-btn-ghost { background: #fff; border: 1px solid #CBD5E1; color: #475569; }

    .ssa-table-wrap { background: #fff; border: 1px solid #E2E8F0; border-radius: 16px; overflow-x: auto; }
    table.ssa-table { width: 100%; min-width: 800px; border-collapse: collapse; font-size: 13px; }
    table.ssa-table th { text-align: left; background: #F8FAFC; color: #475569; font-weight: 700; padding: 12px; text-transform: uppercase; font-size: 11px; }
    table.ssa-table td { padding: 12px; border-top: 1px solid #F1F5F9; }

    /* Vertical ID Card */
    .ssa-vertical-card-wrap {
      width: 320px; height: 520px; background: #FFFFFF; border-radius: 16px;
      position: relative; overflow: hidden; display: flex; flex-direction: column;
      box-shadow: 0 20px 45px -10px rgba(15,23,42,0.25), 0 0 0 1px rgba(0,0,0,0.08);
      border: 1px solid #E2E8F0;
    }
    .v-id-top { position: relative; z-index: 2; padding: 18px 16px 4px; text-align: center; }
    .v-id-org-title { font-size: 15px; font-weight: 800; color: #0F172A; line-height: 1.2; margin: 0; text-transform: uppercase; }
    .v-id-org-sub { font-size: 9.5px; font-weight: 600; text-transform: uppercase; color: #64748B; letter-spacing: .08em; margin-top: 2px; }

    .v-id-mid { position: relative; height: 142px; margin: 4px 0; display: flex; align-items: center; justify-content: center; }
    .v-id-photo-frame {
      position: relative; z-index: 3; width: 116px; height: 116px; border-radius: 50%;
      background: #FFFFFF; padding: 4px; box-shadow: 0 8px 24px -4px rgba(13,148,136,0.35);
    }
    .v-id-photo-inner { width: 100%; height: 100%; border-radius: 50%; overflow: hidden; border: 3px solid #0D9488; }
    .v-id-photo-inner img { width: 100%; height: 100%; object-fit: cover; }

    .v-id-name { font-size: 18px; font-weight: 800; color: #0F172A; line-height: 1.2; text-align: center; text-transform: uppercase; }
    .v-id-role { font-size: 10px; font-weight: 700; text-transform: uppercase; color: #0D9488; letter-spacing: .08em; text-align: center; }

    .v-id-details { margin: 8px 20px 0; background: #F8FAFC; border: 1px solid #F1F5F9; border-radius: 12px; padding: 9px 12px; }
    .v-id-table { width: 100%; font-size: 11px; border-collapse: separate; border-spacing: 0 3px; }
    .v-id-table td.k { width: 42%; font-weight: 600; color: #64748B; font-size: 9.5px; text-transform: uppercase; }
    .v-id-table td.sep { width: 6%; color: #94A3B8; font-bold; }
    .v-id-table td.v { font-weight: 700; color: #0F172A; }

    .v-id-footer {
      position: absolute; bottom: 0; left: 0; right: 0; height: 32px;
      background: linear-gradient(135deg, #0D9488, #115E59);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px; color: #fff; font-size: 8.5px; font-weight: 700; text-transform: uppercase;
    }
    .v-id-barcode { width: 90px; height: 12px; opacity: 0.85; background: repeating-linear-gradient(90deg, #FFFFFF 0 2px, transparent 2px 5px); }

    .ssa-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,.75); z-index: 9999; align-items: center; justify-content: center; padding: 16px; }
    .ssa-modal { background: #fff; border-radius: 20px; width: 100%; max-width: 460px; padding: 26px; max-height: 90vh; overflow-y: auto; }
    #ssa-print-zone { position: fixed; left: -9999px; top: 0; }
  </style>
</head>
<body>

<div id="ssa-root"></div>
<div id="ssa-print-zone"></div>

<script>
(function() {
  var settings = {
    orgName: 'SHOPTODASH SOHOJATRA',
    orgSub: 'Savings & Credit Co-operative Society',
    phone: '+880 1712-345678',
    email: 'info@shoptodash.org',
    address: 'Bagmara, Rajshahi, Bangladesh',
    cardTheme: 'teal',
    defaultInstallment: 1000,
    defaultDueDay: 12,
    defaultFine: 300
  };

  var db = firebase.firestore();
  var auth = firebase.auth();
  var authReady = new Promise(function(resolve) {
    auth.onAuthStateChanged(function(u) {
      if (u) resolve(u);
      else auth.signInAnonymously().then(function(c){ resolve(c.user); }).catch(function(){ resolve(null); });
    });
  });

  var state = { members: [], dueMembers: [], dashboard: null, page: 'dashboard', auth: null };
  var FALLBACK_AVATAR = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22%230d9488%22%3E%3Cpath%20d%3D%22M12%2012c2.21%200%204-1.79%204-4s-1.79-4-4-4-4%201.79-4%204%201.79%204%204%204zm0%202c-2.67%200-8%201.34-8%204v2h16v-2c0-2.66-5.33-4-8-4z%22%2F%3E%3C%2Fsvg%3E';

  function esc(s){ return (s===undefined||s===null)?'':String(s); }
  function money(n){ return Number(n||0).toLocaleString('en-US'); }

  function toWhatsApp(mobile) {
    if (!mobile) return null;
    var digits = String(mobile).replace(/\D/g, '');
    if (!digits) return null;
    if (digits.startsWith('0') && digits.length === 11) digits = '88' + digits;
    return digits;
  }

  function buildVerticalIdCardHtml(m) {
    var photoSrc = m.Photo || FALLBACK_AVATAR;
    return (
      '<div class="ssa-vertical-card-wrap" id="v-card-element">' +
        '<div class="v-id-top">' +
          '<div style="width:34px; height:34px; margin:0 auto 4px; border-radius:50%; background:#0D9488; display:flex; align-items:center; justify-content:center; color:#fff;">' +
            '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>' +
          '</div>' +
          '<h2 class="v-id-org-title">' + esc(settings.orgName) + '</h2>' +
          '<p class="v-id-org-sub">' + esc(settings.orgSub) + '</p>' +
        '</div>' +
        '<div class="v-id-mid">' +
          '<svg style="position:absolute; inset:0; width:100%; height:100%; pointer-events:none;" viewBox="0 0 320 142" fill="none">' +
            '<path d="M 0 22 L 78 22 C 102 22 122 44 126 71 C 122 98 102 120 78 120 L 0 120 Z" fill="#0D9488"/>' +
            '<path d="M 320 22 L 242 22 C 218 22 198 44 194 71 C 198 98 218 120 242 120 L 320 120 Z" fill="#0D9488"/>' +
          '</svg>' +
          '<div class="v-id-photo-frame">' +
            '<div class="v-id-photo-inner"><img src="' + photoSrc + '" crossorigin="anonymous"></div>' +
          '</div>' +
        '</div>' +
        '<div class="v-id-name">' + esc(m.Name) + '</div>' +
        '<div class="v-id-role">HONORARY MEMBER</div>' +
        '<div class="v-id-details">' +
          '<table class="v-id-table">' +
            '<tr><td class="k">MEMBER ID</td><td class="sep">:</td><td class="v">' + esc(m.MemberNo) + '</td></tr>' +
            '<tr><td class="k">MOBILE</td><td class="sep">:</td><td class="v">' + esc(m.Mobile || '—') + '</td></tr>' +
            (m.BloodGroup ? '<tr><td class="k">BLOOD GROUP</td><td class="sep">:</td><td class="v" style="color:#E11D48;">' + esc(m.BloodGroup) + '</td></tr>' : '') +
            '<tr><td class="k">INSTALLMENT</td><td class="sep">:</td><td class="v" style="color:#0D9488;">৳ ' + money(m.InstallmentAmount) + '</td></tr>' +
            '<tr><td class="k">TOTAL SAVINGS</td><td class="sep">:</td><td class="v" style="color:#4F46E5;">৳ ' + money(m.totalPaid || 0) + '</td></tr>' +
            '<tr><td class="k">ISSUE DATE</td><td class="sep">:</td><td class="v">' + (new Date().toLocaleDateString('en-US')) + '</td></tr>' +
          '</table>' +
        '</div>' +
        '<div class="v-id-footer">' +
          '<span>ID: ' + esc(m.MemberNo) + '</span>' +
          '<div class="v-id-barcode"></div>' +
          '<span>' + new Date().getFullYear() + '</span>' +
        '</div>' +
      '</div>'
    );
  }

  // Export Master PDF using html2canvas-pro
  window.downloadAllMembersPdf = function() {
    var zone = document.getElementById('ssa-print-zone');
    var rows = state.members.map(function(m, idx) {
      return (
        '<tr style="border-bottom: 1px solid #E2E8F0; font-size: 13px;">' +
          '<td style="padding:10px 8px;text-align:center;">' + (idx+1) + '</td>' +
          '<td style="padding:10px 8px;font-weight:bold;color:#0D9488;">' + esc(m.MemberNo) + '</td>' +
          '<td style="padding:10px 8px;font-weight:bold;">' + esc(m.Name) + '</td>' +
          '<td style="padding:10px 8px;">' + esc(m.Mobile||'—') + '</td>' +
          '<td style="padding:10px 8px;text-align:right;">৳ ' + money(m.InstallmentAmount) + '</td>' +
          '<td style="padding:10px 8px;text-align:right;font-weight:bold;color:#047857;">৳ ' + money(m.totalPaid) + '</td>' +
        '</tr>'
      );
    }).join('');

    zone.innerHTML = (
      '<div style="width:1050px; background:#fff; padding:40px; font-family:\'Poppins\',sans-serif;" id="master-pdf">' +
        '<div style="border-bottom:3px solid #0D9488; padding-bottom:15px; margin-bottom:20px; display:flex; justify-content:space-between;">' +
          '<div><h1 style="margin:0;font-size:22px;color:#0F172A;text-transform:uppercase;">' + esc(settings.orgName) + '</h1>' +
          '<p style="margin:3px 0;font-size:12px;color:#64748B;">' + esc(settings.orgSub) + '</p></div>' +
          '<div style="text-align:right;"><div style="font-size:16px;font-weight:bold;color:#0D9488;">ALL MEMBERS MASTER DIRECTORY</div>' +
          '<div style="font-size:12px;color:#64748B;">Date: ' + new Date().toLocaleDateString('en-US') + '</div></div>' +
        '</div>' +
        '<table style="width:100%; border-collapse:collapse;">' +
          '<thead><tr style="background:#0D9488;color:#fff;font-size:12px;text-transform:uppercase;"><th style="padding:10px 8px;">#</th><th style="padding:10px 8px;">ID</th><th style="padding:10px 8px;">Name</th><th style="padding:10px 8px;">Mobile</th><th style="padding:10px 8px;text-align:right;">Installment</th><th style="padding:10px 8px;text-align:right;">Total Savings</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table>' +
      '</div>'
    );

    window.html2canvas(document.getElementById('master-pdf'), { scale: 2.2, backgroundColor: '#ffffff' }).then(function(canvas) {
      var pdf = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
      var pageW = 210, pageH = 297;
      var imgH = (canvas.height * pageW) / canvas.width;
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, pageW, Math.min(imgH, pageH));
      pdf.save('All_Members_Directory.pdf');
      zone.innerHTML = '';
    });
  };

  window.downloadIdCardPdf = function(m) {
    var zone = document.getElementById('ssa-print-zone');
    zone.innerHTML = buildVerticalIdCardHtml(m);
    var el = document.getElementById('v-card-element');
    window.html2canvas(el, { scale: 3.5, backgroundColor: '#ffffff', useCORS: true }).then(function(canvas) {
      var pdf = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: [54, 86] });
      pdf.addImage(canvas.toDataURL('image/jpeg', 0.95), 'JPEG', 0, 0, 54, 86);
      pdf.save(m.Name + '-ID-Badge.pdf');
      zone.innerHTML = '';
    });
  };

  window.previewIdCard = function(mId) {
    var m = state.members.find(function(x){ return String(x.ID) === String(mId); });
    if (!m) return;
    document.getElementById('ssa-profile-card-holder').innerHTML = buildVerticalIdCardHtml(m);
    document.getElementById('ssa-profile-download-btn').onclick = function() { window.downloadIdCardPdf(m); };
    document.getElementById('ssa-profile-overlay').style.display = 'flex';
  };

  function renderLogin() {
    document.getElementById('ssa-root').innerHTML = (
      '<div class="ssa-login-wrap"><div class="ssa-login-card">' +
        '<h1 style="font-size:20px;margin-bottom:4px;text-transform:uppercase;">' + esc(settings.orgName) + '</h1>' +
        '<p style="font-size:12px;color:#64748B;margin-top:0;text-transform:uppercase;">' + esc(settings.orgSub) + '</p>' +
        '<form id="ssa-login-form" style="margin-top:20px;">' +
          '<div class="ssa-field"><label>Username</label><input type="text" id="ssa-user" required></div>' +
          '<div class="ssa-field"><label>Password</label><input type="password" id="ssa-pass" required></div>' +
          '<button class="ssa-login-btn" type="submit">Sign In</button>' +
          '<div id="ssa-login-err" style="color:#E11D48;font-size:12px;margin-top:10px;"></div>' +
        '</form>' +
      '</div></div>'
    );
    document.getElementById('ssa-login-form').onsubmit = function(e) {
      e.preventDefault();
      var u = document.getElementById('ssa-user').value.trim();
      var p = document.getElementById('ssa-pass').value;
      authReady.then(function() {
        return db.collection('users').doc(u).get();
      }).then(function(doc) {
        if (doc.exists && String(doc.data().password) === String(p)) {
          state.auth = { username: u, name: doc.data().name || u, role: doc.data().role || 'Operator' };
          sessionStorage.setItem('ssa_auth', JSON.stringify(state.auth));
          renderApp();
        } else if (u === 'admin' && p === 'admin') {
          state.auth = { username: 'admin', name: 'Chief Administrator', role: 'Admin' };
          sessionStorage.setItem('ssa_auth', JSON.stringify(state.auth));
          renderApp();
        } else {
          document.getElementById('ssa-login-err').textContent = 'Invalid username or password!';
        }
      });
    };
  }

  function renderApp() {
    document.getElementById('ssa-root').innerHTML = (
      '<div class="ssa-shell">' +
        '<div class="ssa-sidebar">' +
          '<h2 style="font-size:14px;text-transform:uppercase;margin:0 0 4px;">' + esc(settings.orgName) + '</h2>' +
          '<p style="font-size:10px;color:#A7F3D0;text-transform:uppercase;margin:0 0 20px;">' + esc(settings.orgSub) + '</p>' +
          '<div class="ssa-nav">' +
            '<button class="active" onclick="location.reload()">Dashboard</button>' +
            '<button onclick="window.downloadAllMembersPdf()">Export PDF</button>' +
          '</div>' +
          '<button class="ssa-btn" style="background:#E11D48;color:#fff;margin-top:auto;" onclick="sessionStorage.clear();location.reload();">Sign Out</button>' +
        '</div>' +
        '<div class="ssa-main" id="ssa-main"></div>' +
      '</div>' +
      '<div class="ssa-overlay" id="ssa-profile-overlay"><div class="ssa-modal" style="max-width:400px; text-align:center;">' +
        '<div id="ssa-profile-card-holder" style="display:flex; justify-content:center;"></div>' +
        '<div style="margin-top:20px; display:flex; justify-content:center; gap:10px;">' +
          '<button type="button" class="ssa-btn ssa-btn-ghost" onclick="document.getElementById(\'ssa-profile-overlay\').style.display=\'none\'">Close</button>' +
          '<button type="button" class="ssa-btn ssa-btn-primary" id="ssa-profile-download-btn">Download PDF</button>' +
        '</div>' +
      '</div></div>'
    );
    loadData();
  }

  function loadData() {
    authReady.then(function() {
      return db.collection('members').get();
    }).then(function(snap) {
      var arr = [];
      snap.forEach(function(d) {
        var data = d.data();
        arr.push({
          ID: d.id, Name: data.name, MemberNo: data.member_no, Mobile: data.mobile,
          InstallmentAmount: data.installment_amount || 1000,
          Photo: data.photo || '', BloodGroup: data.blood_group || ''
        });
      });
      state.members = arr;
      return db.collection('payments').get();
    }).then(function(psnap) {
      var pMap = {};
      psnap.forEach(function(d) {
        var p = d.data();
        var mId = String(p.member_id);
        if (!pMap[mId]) pMap[mId] = 0;
        pMap[mId] += Number(p.amount || 0);
      });
      state.members.forEach(function(m) { m.totalPaid = pMap[m.ID] || 0; });
      renderMembersTable();
    });
  }

  function renderMembersTable() {
    var rows = state.members.map(function(m, idx) {
      var wa = toWhatsApp(m.Mobile);
      var waLink = wa ? ('https://wa.me/' + wa) : null;
      return (
        '<tr>' +
          '<td>' + (idx+1) + '</td>' +
          '<td style="font-weight:bold;color:#0D9488;">' + esc(m.MemberNo) + '</td>' +
          '<td style="font-weight:bold;">' + esc(m.Name) + '</td>' +
          '<td>' +
            (waLink ? ('<a href="' + waLink + '" target="_blank" style="color:#059669;font-weight:600;text-decoration:none;">' + esc(m.Mobile) + ' (WhatsApp)</a>') : esc(m.Mobile||'—')) +
          '</td>' +
          '<td>৳ ' + money(m.InstallmentAmount) + '</td>' +
          '<td style="font-weight:bold;color:#059669;">৳ ' + money(m.totalPaid) + '</td>' +
          '<td><button class="ssa-btn ssa-btn-primary" onclick="previewIdCard(\'' + m.ID + '\')">ID Badge</button></td>' +
        '</tr>'
      );
    }).join('');

    document.getElementById('ssa-main').innerHTML = (
      '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">' +
        '<h1 style="font-size:20px;text-transform:uppercase;margin:0;">Members Directory (' + state.members.length + ')</h1>' +
        '<button class="ssa-btn ssa-btn-primary" onclick="window.downloadAllMembersPdf()">Download All Members PDF</button>' +
      '</div>' +
      '<div class="ssa-table-wrap">' +
        '<table class="ssa-table"><thead><tr><th>#</th><th>Member ID</th><th>Name</th><th>Mobile</th><th>Rate</th><th>Total Paid</th><th>Action</th></tr></thead>' +
        '<tbody>' + rows + '</tbody></table>' +
      '</div>'
    );
  }

  var saved = sessionStorage.getItem('ssa_auth');
  if (saved) {
    try { state.auth = JSON.parse(saved); renderApp(); } catch(e){ renderLogin(); }
  } else {
    renderLogin();
  }
})();
</script>
</body>
</html>
